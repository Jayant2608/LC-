name: Sync Leetcode

on:
  workflow_dispatch: # Allows you to trigger it manually anytime
  schedule:
    - cron: "0 8 * * 6" # Automatically runs once a week (Saturdays at 8:00 AM)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Sync Past Solutions
        uses: joshcai/leetcode-sync@v1.7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: leetcode-problems # The folder name inside your repo
          verbose: true
          commit-header: "[LeetCode Sync]"
